# HiveOS custom-miner manifest for csd-pool-miner (P4 §1 / SP2).
#
# HiveOS sources this file to learn the miner's name/version, where its binary
# and config live, and which localhost port to read stats from. Install layout
# (a tarball extracted under /hive/miners/custom/<CUSTOM_NAME>/):
#
#   /hive/miners/custom/csdpool/
#     ├── h-manifest.conf      (this file)
#     ├── h-config.sh          (render config.toml from the flightsheet)
#     ├── h-run.sh             (start the miner — launches relay THEN execs csd-gpu-miner)
#     ├── h-stats.sh           (emit HiveOS h-stats from /<port>/1/summary)
#     ├── csd-gpu-miner        (the actual mining binary, linux build)
#     └── csd-relay-node       (SP2: canonical-anchor relay, pre-built csd2 node binary;
#                               resource-capped at lowest CPU+IO priority so it never
#                               starves the GPU miner; launched by h-run.sh BEFORE
#                               the exec that replaces the shell with csd-gpu-miner)
#
# NOTE the exec-rename hazard: HiveOS refuses to start a custom miner if
# `h-run.sh` appears in the process argv. CUSTOM_BIN therefore points at the
# REAL binary `csd-gpu-miner` (a different name), and h-run.sh `exec`s it so the
# argv HiveOS inspects is the binary's, not the wrapper's.
#
# SP2 relay-node resource cap (enforced in h-run.sh):
#   nice -n 19     — lowest user-space CPU scheduling priority
#   ionice -c 3    — idle I/O class (only uses disk when nothing else does)
# NOTE: taskset intentionally absent — pinning to core 0 shares the system/IRQ
# core and harms latency. nice+ionice provide sufficient yield without core pinning.

CUSTOM_NAME=csdpool
# Display-only in the HiveOS UI. The auto-updater keys off the BINARY's own
# --version (and latest-version.txt), NOT this string, so it need not track the
# release tag exactly; bumped here only for operator clarity.
CUSTOM_VERSION=0.1.19
CUSTOM_BUILD=1

# The actual mining binary (NOT h-run.sh — see the exec-rename note above).
CUSTOM_BIN="/hive/miners/custom/csdpool/csd-gpu-miner"

# Rendered by h-config.sh from the flightsheet; consumed by h-run.sh.
CUSTOM_CONFIG_FILENAME="/hive/miners/custom/csdpool/config.toml"

# HiveOS log basename (it appends .log). h-run.sh tees the miner output here.
CUSTOM_LOG_BASENAME="/var/log/miner/csdpool/csdpool"

# The miner's --stats-port. h-stats.sh scrapes http://127.0.0.1:$CUSTOM_API_PORT
# /1/summary. Bound to localhost only (never exposed) — HiveOS reads it locally.
CUSTOM_API_PORT=3380
