[package]
name        = "csd-pool-miner"
version     = "0.1.17"
edition     = "2021"
rust-version = "1.75"
license-file = "LICENSE"
description = "Compute Substrate standalone pool miner (CPU default; CUDA + OpenCL optional)."

# The library crate keeps its original name so the binary's
# `use csd_gpu_miner::...` paths (and any downstream consumers) are unchanged
# after the package rename to `csd-pool-miner`.
[lib]
name = "csd_gpu_miner"
path = "src/lib.rs"

[[bin]]
name = "csd-gpu-miner"
path = "src/main.rs"

[features]
# Default is CPU-only so the crate builds with no GPU toolchain present.
# Enable a GPU backend explicitly, e.g.:
#   cargo build --release --features cuda
#   cargo build --release --features opencl
#   cargo build --release --features "cuda,opencl"   # auto-pick best at runtime
default     = ["cpu-only"]
cuda        = ["dep:cudarc"]
opencl      = ["dep:opencl3"]
# Explicit CPU-only marker (no GPU toolchain required). Carries no deps.
cpu-only    = []
# OPTIONAL NVIDIA GPU telemetry + temperature-limit safety (secondary build
# ONLY — NOT in the lean fleet/primary release). Pulls in `nvml-wrapper`, which
# loads the NVIDIA Management Library (`nvml.dll` / `libnvidia-ml.so`) at RUNTIME
# via the driver — no CUDA Toolkit, no build-time link to any NVIDIA lib, so the
# crate still builds on a host with no NVIDIA anything. On a non-NVIDIA host (or
# when NVML can't load) telemetry degrades to disabled and the miner keeps
# running. The default `cpu-only` build pulls in NOTHING here.
nvml        = ["dep:nvml-wrapper"]
# OPTIONAL native Windows Service (secondary build ONLY — NOT in the lean
# fleet/primary release). Lets the miner register itself with the Windows
# Service Control Manager (`--install-service`) and run headless under it
# (`--run-as-service`) with auto-restart on crash + clean stop/shutdown
# handling. The pure flag/mode parsing is ALWAYS compiled (and unit-tested);
# only the SCM glue is gated. The dep (`windows-service`) is declared under a
# `cfg(windows)` target table, so this feature is a NO-OP on non-Windows and
# the default `cpu-only` build pulls in NOTHING here. `dep:windows-service`
# means enabling `winsvc` is what activates the (Windows-only) crate.
winsvc      = ["dep:windows-service"]

[dependencies]
anyhow      = "1.0"
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"
toml        = "0.8"
hex         = "0.4"
sha2        = { version = "0.10", features = ["compress"] }
rand        = "0.8"
rand_chacha = "0.3"
# Wallet keygen (`newwallet` subcommand). Versions pinned to MATCH the CSD chain
# (compute-substrate) so addr20 derivation is byte-identical and spendable:
#   addr20 = RIPEMD160(SHA256(compressed_secp256k1_pubkey)).
# secp256k1 0.29 + ripemd 0.1 are exactly what the chain's Cargo.toml uses.
secp256k1   = { version = "0.29", features = ["rand", "global-context"] }
ripemd      = "0.1"
humantime   = "2"
clap        = { version = "4.5", features = ["derive"] }
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender   = "0.2"
ctrlc       = "3"
# G6 Discord webhook notifier (HTTPS-only). ureq = a BLOCKING, synchronous HTTP
# client with rustls TLS and NO async runtime — so the miner stays tokio-free.
# default-features off drops gzip/cookies/charset; "tls" = rustls + webpki-roots,
# "json" = send_json. This is the only TLS dependency in the binary.
ureq        = { version = "2", default-features = false, features = ["tls", "json"] }

# Optional GPU backends; the default CPU-only build pulls in neither, and neither
# needs a GPU toolchain on the BUILD host. CUDA embeds a pre-built PTX (see
# src/backends/cuda.rs) and JITs it via the NVIDIA driver at runtime — never via
# NVRTC — so only the driver is required at runtime, no CUDA Toolkit. The `nvrtc`
# feature stays ONLY because cudarc's `Ptx` type (consumed by `load_module`) lives
# behind it; the NVRTC compiler itself is never invoked.
cudarc      = { version = "0.19", features = ["cuda-13020", "driver", "nvrtc"], optional = true }
opencl3     = { version = "0.9", optional = true }
# OPTIONAL (feature = "nvml") NVIDIA telemetry. `nvml-wrapper` is a thin, safe
# wrapper over NVML that dlopen's the driver's management library at runtime —
# it does NOT link any NVIDIA lib at build time, so this compiles on any host.
# default-features kept (no extra surface); not a packer/obfuscator.
nvml-wrapper = { version = "0.10", optional = true }

# OPTIONAL (feature = "winsvc") native Windows Service support. Declared under a
# Windows-only target table so it is never resolved/fetched on Linux/macOS — the
# `winsvc` feature there activates nothing (the SCM glue is `cfg(windows)` too).
# `windows-service` is a thin, safe wrapper over the SCM APIs in `windows-sys`
# (`advapi32`/`kernel32`, already part of Windows); it links no third-party DLL,
# uses no packer/obfuscator, and opens no network endpoint. Its only transitive
# additions over what the binary already pulls in (windows-sys 0.61, windows-link,
# bitflags are present) are `windows-service` + `widestring`.
[target.'cfg(windows)'.dependencies]
windows-service = { version = "0.8", optional = true }

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
debug         = false
strip         = true
# unwind (not abort) so the miner can catch panics from cudarc when an
# incompatible CUDA toolkit is installed, and fall back to OpenCL cleanly.
panic         = "unwind"
