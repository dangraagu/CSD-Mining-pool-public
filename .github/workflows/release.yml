name: release

# Builds the Windows + Linux miner binaries and publishes them to a GitHub Release.
#
# Triggers:
#   * push a tag  v*   -> build all variants AND publish them to the release
#   * workflow_dispatch -> build only (smoke-test that everything compiles)
#
# Assets produced (consumed by install-csd-miner.bat / install-csd-miner.sh):
#   csd-pool-miner-cpu.exe    / csd-pool-miner-linux-cpu     (always; no GPU deps)
#   csd-pool-miner-nvidia.exe / csd-pool-miner-linux-nvidia  (CUDA; best-effort)
#   csd-pool-miner-amd.exe    / csd-pool-miner-linux-amd     (OpenCL; best-effort)
#   csd-pool-miner-<ver>.tar.gz                              (HiveOS custom miner; also incl. csd-relay-node)
#   csd-pool-miner.tar.gz                                    (stable-named alias of the above for releases/latest/download)
#   csd-relay-node                                           (SP2: canonical-anchor relay, fetched from csd2 release)
#   SHA256SUMS                                               (digests of all the above)
#
# SP2 — csd-relay-node binary source
# ────────────────────────────────────────────────────────────────────────────────
# The relay-node binary is NOT built here; it is the csd-node binary produced by
# the CSD2 node repository (https://github.com/dangraagu/csd2) and fetched at
# release-assembly time from a pinned release.
#
# *** OPERATOR ACTION REQUIRED before tagging v0.1.9 ***
# After the csd2 node build ships its first tagged release, update these two
# constants to the real tag and asset URL:
#
#   RELAY_NODE_VERSION    = the csd2 release tag (e.g. "v0.1.0")
#   RELAY_NODE_ASSET_URL  = direct download URL of the Linux binary asset
#
# Until then, the linux packaging step downloads a placeholder (or fails
# gracefully with a warning) so the miner assets still publish.
# ────────────────────────────────────────────────────────────────────────────────
# SP2_RELAY_CONSTANTS_START
#   RELAY_NODE_VERSION="FILL_ME_IN"
#   RELAY_NODE_REPO="dangraagu/csd2"
#   RELAY_NODE_ASSET="csd-node-linux"
#   RELAY_NODE_ASSET_URL="https://github.com/${RELAY_NODE_REPO}/releases/download/${RELAY_NODE_VERSION}/${RELAY_NODE_ASSET}"
# SP2_RELAY_CONSTANTS_END
#
# The build jobs upload their artifacts; a final `release` job downloads them
# all, generates ONE SHA256SUMS over every asset, and publishes the lot in a
# single step. That single-publisher design is what lets SHA256SUMS cover assets
# from BOTH OS jobs without two jobs racing to write the same file, and it is
# what the self-update integrity check (mine-auto's verify-file) compares
# against — without SHA256SUMS the updater has nothing to verify a download
# against, so this job is load-bearing, not cosmetic.
#
# NOTE for the operator: before tagging, confirm src/endpoint.rs points at the
# intended live pool. It is ALREADY set to the production endpoint (verified by the
# pool_endpoint_decodes_to_expected test) — the binary does NOT ship a placeholder;
# only edit it if you want to ship a different pool.
#
# FIRST-RUN ITERATION POINTS (these run on GitHub, not locally — watch the logs):
#   * The CPU build is the safe one and should always succeed.
#   * The NVIDIA/AMD builds are marked continue-on-error so a failure there does
#     NOT block the CPU release. The AMD/OpenCL link step (vcpkg) is the most
#     likely thing to need adjustment on the first run.

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Prepare dist folder
        shell: pwsh
        run: New-Item -ItemType Directory -Force dist | Out-Null

      - name: Build CPU (always works, no GPU deps)
        shell: pwsh
        run: |
          cargo build --release
          Copy-Item target/release/csd-gpu-miner.exe dist/csd-pool-miner-cpu.exe

      - name: Build NVIDIA (cuda)
        continue-on-error: true
        shell: pwsh
        run: |
          cargo build --release --features cuda
          Copy-Item target/release/csd-gpu-miner.exe dist/csd-pool-miner-nvidia.exe

      - name: Install OpenCL via vcpkg (for the AMD build)
        continue-on-error: true
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install opencl:x64-windows
          "LIB=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\lib;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build AMD (opencl)
        continue-on-error: true
        shell: pwsh
        run: |
          cargo build --release --features opencl
          Copy-Item target/release/csd-gpu-miner.exe dist/csd-pool-miner-amd.exe

      - name: List built artifacts
        shell: pwsh
        run: Get-ChildItem dist

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Prepare dist folder
        run: mkdir -p dist

      - name: Build CPU (always works, no GPU deps)
        run: |
          cargo build --release
          cp target/release/csd-gpu-miner dist/csd-pool-miner-linux-cpu

      # NVIDIA: the CUDA backend embeds a pre-built PTX and JITs it via the driver,
      # so this build needs NO CUDA Toolkit on the runner (cudarc dlopens the driver
      # at runtime; the PTX is committed). continue-on-error keeps CPU shipping.
      - name: Build NVIDIA (cuda)
        continue-on-error: true
        run: |
          cargo build --release --features cuda
          cp target/release/csd-gpu-miner dist/csd-pool-miner-linux-nvidia

      - name: Install OpenCL loader + headers (for the AMD build)
        continue-on-error: true
        run: sudo apt-get update && sudo apt-get install -y ocl-icd-opencl-dev

      - name: Build AMD (opencl)
        continue-on-error: true
        run: |
          cargo build --release --features opencl
          cp target/release/csd-gpu-miner dist/csd-pool-miner-linux-amd

      # SP2: Fetch the pre-built csd-relay-node Linux binary from the pinned csd2
      # release. This binary is NOT built here — it is the csd-node produced by the
      # separate CSD2 node repo.  The relay-node ends up in:
      #   - dist/csd-relay-node          (standalone download, SHA256SUMS covered)
      #   - hiveos-pkg/csd-pool-miner/   (inside the HiveOS tarball)
      #
      # OPERATOR: update RELAY_NODE_VERSION + RELAY_NODE_ASSET_URL before tagging.
      # RELAY_NODE_VERSION + RELAY_NODE_SHA256 are now real (relay-v0.1.9), so this
      # step HARD-BLOCKS the release: a relay download failure or SHA256 mismatch
      # fails the job instead of shipping a miner with no bundled relay. Was
      # continue-on-error: true while the constants were FILL_ME_IN (deploy-check OPS-1).
      - name: Fetch csd-relay-node binary (SP2)
        continue-on-error: false
        env:
          # ── SP2 relay-node source constants ────────────────────────────────────
          # Update ALL THREE of these when the csd2 repo cuts its first tagged release.
          # RELAY_NODE_SHA256 must be the sha256 hex of the RELAY_NODE_ASSET file at
          # that release (run: sha256sum csd-node-linux). Without it the fetch step
          # downloads but does NOT verify; set it to hard-gate the integrity check.
          RELAY_NODE_VERSION: "relay-v0.1.9"
          RELAY_NODE_REPO: "dangraagu/CSD-Mining-pool-public"
          RELAY_NODE_ASSET: "csd-node-linux"
          RELAY_NODE_SHA256: "5f6e44fefbf46dfce1edddb50733e76249198e6ee6ced6bae19761df2fcd44dc"
          # ───────────────────────────────────────────────────────────────────────
        run: |
          set -euo pipefail
          mkdir -p dist hiveos-pkg/csd-pool-miner

          # Hard-gate: fail the build (on a real tag push) if the operator has not
          # wired in a real version.  On workflow_dispatch smoke runs the step is
          # continue-on-error so this is a warning only; once the step's
          # continue-on-error is flipped to false (after real URL + SHA are set)
          # this becomes a hard build blocker.
          if [ "$RELAY_NODE_VERSION" = "FILL_ME_IN" ]; then
            if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
              echo "::error::SP2 relay-node version is still FILL_ME_IN — cannot ship a tagged release without a real relay binary. Update RELAY_NODE_VERSION + RELAY_NODE_SHA256 in release.yml."
              exit 1
            else
              echo "::warning::SP2 relay-node URL is not yet configured (RELAY_NODE_VERSION=FILL_ME_IN)."
              echo "::warning::Skipping csd-relay-node fetch. Update the constants in release.yml before shipping v0.1.9."
              exit 0
            fi
          fi

          RELAY_URL="https://github.com/${RELAY_NODE_REPO}/releases/download/${RELAY_NODE_VERSION}/${RELAY_NODE_ASSET}"
          echo "SP2: downloading csd-relay-node from $RELAY_URL"
          curl -fL --retry 3 -o dist/csd-relay-node "$RELAY_URL"

          # SHA256 integrity check: verify the downloaded binary against the pinned
          # hash BEFORE chmod+cp so a tampered/truncated download is rejected here.
          if [ "$RELAY_NODE_SHA256" = "FILL_ME_IN" ]; then
            echo "::warning::SP2: RELAY_NODE_SHA256 is FILL_ME_IN — skipping integrity verify. Set it to the expected sha256 hex of ${RELAY_NODE_ASSET} at ${RELAY_NODE_VERSION} before shipping."
          else
            GOT="$(sha256sum dist/csd-relay-node | awk '{print $1}')"
            if [ "$GOT" != "$RELAY_NODE_SHA256" ]; then
              echo "::error::SP2: SHA256 mismatch for csd-relay-node! got=$GOT want=$RELAY_NODE_SHA256"
              rm -f dist/csd-relay-node
              exit 1
            fi
            echo "SP2: csd-relay-node SHA256 OK ($GOT)"
          fi

          chmod +x dist/csd-relay-node
          # Also stage a copy for the HiveOS tarball (picked up in the next step).
          cp dist/csd-relay-node hiveos-pkg/csd-pool-miner/csd-relay-node
          echo "SP2: csd-relay-node fetched OK ($(du -sh dist/csd-relay-node | cut -f1))"

      # Package the HiveOS custom miner: the hiveos/ glue (h-manifest.conf,
      # h-config.sh, h-run.sh, h-stats.sh) + the linux CPU binary renamed to the
      # name the manifest expects (csd-gpu-miner), + the relay-node binary (SP2).
      # The tarball's top dir is the custom-miner name HiveOS extracts under
      # /hive/miners/custom/.
      - name: Package HiveOS custom miner
        run: |
          set -euo pipefail
          # Derive the version: tag (strip the leading v) on a tag build, else the
          # Cargo.toml version on a workflow_dispatch smoke run.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          fi
          PKG="csd-pool-miner"
          STAGE="hiveos-pkg/$PKG"
          mkdir -p "$STAGE"
          cp hiveos/h-manifest.conf hiveos/h-config.sh hiveos/h-run.sh hiveos/h-stats.sh "$STAGE"/
          chmod +x "$STAGE"/h-config.sh "$STAGE"/h-run.sh "$STAGE"/h-stats.sh
          # The HiveOS binary must be named csd-gpu-miner (the manifest CUSTOM_BIN).
          cp target/release/csd-gpu-miner "$STAGE"/csd-gpu-miner
          chmod +x "$STAGE"/csd-gpu-miner
          # SP2: include csd-relay-node if the fetch step above placed it here.
          # The relay-node is optional at package time (the fetch step is
          # continue-on-error); its absence means the miner tarball ships without
          # relay support (valid for pre-0.1.9 test builds).
          if [ -f "$STAGE/csd-relay-node" ]; then
            chmod +x "$STAGE"/csd-relay-node
            echo "SP2: csd-relay-node included in HiveOS tarball."
          else
            echo "::warning::SP2: csd-relay-node NOT found in $STAGE — tarball ships without relay binary."
          fi
          tar -czf "dist/${PKG}-${VER}.tar.gz" -C hiveos-pkg "$PKG"
          echo "packed dist/${PKG}-${VER}.tar.gz"
          # Also publish a STABLE-NAMED copy so the HiveOS Installation URL can be
          # the non-staling  releases/latest/download/csd-pool-miner.tar.gz  form
          # (docs/HIVEOS.md) instead of a pinned vX.Y.Z tarball that goes stale
          # every release. Byte-identical to the versioned tarball; SHA256SUMS
          # (generated in the release job over every dist/ file) covers both.
          cp "dist/${PKG}-${VER}.tar.gz" "dist/${PKG}.tar.gz"
          echo "packed dist/${PKG}.tar.gz (stable-named alias for releases/latest)"

      - name: List built artifacts
        run: ls -la dist

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/*
          if-no-files-found: error

  # Single publisher: gather every built asset, emit ONE SHA256SUMS over all of
  # them, then publish binaries + HiveOS tarball + SHA256SUMS together. Runs only
  # on a tag (the build jobs still run on workflow_dispatch as a compile smoke
  # test, but nothing is published there).
  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect assets + generate SHA256SUMS
        run: |
          set -euo pipefail
          mkdir -p dist
          # Flatten dist-windows/ and dist-linux/ into one dist/.
          find artifacts -type f -exec cp -t dist/ {} +
          cd dist
          # One checksums file over every published asset (sha256sum format:
          # "<hex>  <filename>"), which verify-file / sha256sum -c read back.
          # Build an explicit file list that EXCLUDES SHA256SUMS itself so the
          # digests file can never (self-)reference a partially-written copy of
          # itself regardless of glob/redirect ordering.
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\n' | sort > .asset-list
          xargs -a .asset-list sha256sum -- > SHA256SUMS
          rm -f .asset-list
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: false
