name: release

# Builds the Windows + Linux miner binaries and publishes them to a GitHub Release.
#
# Triggers:
#   * push a tag  v*   -> build all variants AND publish them to the release
#   * workflow_dispatch -> build only (smoke-test that everything compiles)
#
# Assets produced (consumed by install-csd-miner.bat / install-csd-miner.sh):
#   csd-pool-miner-cpu.exe    / csd-pool-miner-linux-cpu     (always; no GPU deps)
#   csd-pool-miner-nvidia.exe / csd-pool-miner-linux-nvidia  (CUDA; best-effort)
#   csd-pool-miner-amd.exe    / csd-pool-miner-linux-amd     (OpenCL; best-effort)
#   csdpool-<ver>.tar.gz                                     (HiveOS custom miner; also incl. csd-relay-node. hyphen-free name
#                                                             so HiveOS's version-strip parser derives "csdpool" cleanly)
#   csdpool.tar.gz                                           (stable-named alias of the above for releases/latest/download)
#   csd-relay-node                                           (SP2: canonical-anchor relay, fetched from csd2 release)
#   latest-version.txt                                       (just the version string, e.g. "0.1.10"; CDN-served so the
#                                                             launchers resolve "latest" WITHOUT the 60/hr GitHub API limit)
#   csd-dashboard.sh / csd-dashboard.bat                     (live terminal miner dashboard; read-only /1/summary viewer; self-updating via --update)
#   SHA256SUMS                                               (digests of all the above)
#
# SP2 — csd-relay-node binary source
# ────────────────────────────────────────────────────────────────────────────────
# The relay-node binary is NOT built here; it is the csd-node binary produced by
# the CSD2 node repository (https://github.com/dangraagu/csd2) and fetched at
# release-assembly time from a pinned release.
#
# *** OPERATOR ACTION REQUIRED before tagging v0.1.9 ***
# After the csd2 node build ships its first tagged release, update these two
# constants to the real tag and asset URL:
#
#   RELAY_NODE_VERSION    = the csd2 release tag (e.g. "v0.1.0")
#   RELAY_NODE_ASSET_URL  = direct download URL of the Linux binary asset
#
# Until then, the linux packaging step downloads a placeholder (or fails
# gracefully with a warning) so the miner assets still publish.
# ────────────────────────────────────────────────────────────────────────────────
# SP2_RELAY_CONSTANTS_START
#   RELAY_NODE_VERSION="FILL_ME_IN"
#   RELAY_NODE_REPO="dangraagu/csd2"
#   RELAY_NODE_ASSET="csd-node-linux"
#   RELAY_NODE_ASSET_URL="https://github.com/${RELAY_NODE_REPO}/releases/download/${RELAY_NODE_VERSION}/${RELAY_NODE_ASSET}"
# SP2_RELAY_CONSTANTS_END
#
# The build jobs upload their artifacts; a final `release` job downloads them
# all, generates ONE SHA256SUMS over every asset, and publishes the lot in a
# single step. That single-publisher design is what lets SHA256SUMS cover assets
# from BOTH OS jobs without two jobs racing to write the same file, and it is
# what the self-update integrity check (mine-auto's verify-file) compares
# against — without SHA256SUMS the updater has nothing to verify a download
# against, so this job is load-bearing, not cosmetic.
#
# NOTE for the operator: before tagging, confirm src/endpoint.rs points at the
# intended live pool. It is ALREADY set to the production endpoint (verified by the
# pool_endpoint_decodes_to_expected test) — the binary does NOT ship a placeholder;
# only edit it if you want to ship a different pool.
#
# FIRST-RUN ITERATION POINTS (these run on GitHub, not locally — watch the logs):
#   * The CPU build is the safe one and should always succeed.
#   * The NVIDIA/AMD builds are marked continue-on-error so a failure there does
#     NOT block the CPU release. The AMD/OpenCL link step (vcpkg) is the most
#     likely thing to need adjustment on the first run.

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # Shell-script test suite — the launcher/glue logic (HiveOS h-config/h-run variant
  # auto-detect, address normalisation, the Windows .bat parity guards) is enforced
  # here BEFORE anything is packaged or published. It is a REQUIRED predecessor of the
  # linux job (which builds the HiveOS tarball + stages the self-updating launchers),
  # so a regression in this glue (e.g. the v0.1.17 "0 GPU hashrate" backend-trap)
  # blocks the release instead of shipping to the fleet. Pure bash + coreutils — no
  # Rust build, so it is fast and gates the slow build jobs cheaply.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shell test suite (tests/*.sh)
        run: |
          set -euo pipefail
          shopt -s nullglob
          fail=0
          for t in tests/*.sh; do
            echo "::group::$t"
            if bash "$t"; then
              echo "PASS: $t"
            else
              echo "::error::shell test FAILED: $t"
              fail=1
            fi
            echo "::endgroup::"
          done
          [ "$fail" -eq 0 ] || { echo "::error::one or more shell tests failed"; exit 1; }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Prepare dist folder
        shell: pwsh
        run: New-Item -ItemType Directory -Force dist | Out-Null

      - name: Build CPU (always works, no GPU deps; +winsvc Windows-Service glue, no GPU/network dep)
        shell: pwsh
        run: |
          cargo build --release --features winsvc
          Copy-Item target/release/csd-gpu-miner.exe dist/csd-pool-miner-cpu.exe

      - name: Build NVIDIA (cuda + nvml telemetry + winsvc)
        continue-on-error: true
        shell: pwsh
        run: |
          cargo build --release --features cuda,nvml,winsvc
          Copy-Item target/release/csd-gpu-miner.exe dist/csd-pool-miner-nvidia.exe

      - name: Install OpenCL via vcpkg (for the AMD build)
        continue-on-error: true
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install opencl:x64-windows
          "LIB=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\lib;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build AMD (opencl + winsvc)
        continue-on-error: true
        shell: pwsh
        run: |
          cargo build --release --features opencl,winsvc
          Copy-Item target/release/csd-gpu-miner.exe dist/csd-pool-miner-amd.exe

      - name: List built artifacts
        shell: pwsh
        run: Get-ChildItem dist

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/*
          if-no-files-found: error

  linux:
    needs: [test]   # gate the HiveOS/linux package + launcher staging on the shell suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal --no-self-update

      # GLIBC PORTABILITY (v0.2.1 P0 fix): the linux binaries MUST run on stock
      # HiveOS images, which ship glibc 2.27 (Ubuntu 18.04 base) / 2.31 (20.04).
      # A plain `cargo build` on this runner links against the RUNNER's glibc
      # (ubuntu-24.04 = 2.39) and the resulting binary hard-crashes on every
      # stock HiveOS rig with "version 'GLIBC_2.39' not found" (exit 1, HiveOS
      # relaunch loop) — this is exactly what broke the fleet on v0.2.0.
      # cargo-zigbuild uses zig as the C compiler/linker, which can target an
      # arbitrary glibc version; `--target x86_64-unknown-linux-gnu.2.27` pins
      # the floor at 2.27 regardless of what glibc the runner image ships, so
      # future runner migrations (24.04 -> 26.04 -> ...) can never re-break the
      # fleet. The "glibc floor gate" step below fail-closes the release if any
      # produced binary still requires a newer glibc.
      # The pip package bundles the zig toolchain (ziglang wheel) — one install,
      # no separate zig download. Output path note: a --target build lands in
      # target/x86_64-unknown-linux-gnu/release/ (zigbuild strips the .2.27
      # suffix for the directory), NOT target/release/.
      - name: Install cargo-zigbuild + zig (glibc-2.27-portable linux builds)
        run: |
          set -euo pipefail
          # Plain install first; --break-system-packages fallback covers a
          # PEP-668 "externally managed" python (harmless where not needed).
          pip3 install cargo-zigbuild || pip3 install --break-system-packages cargo-zigbuild
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          cargo-zigbuild --version
          python3 -m ziglang version
          rustup target add x86_64-unknown-linux-gnu

      - name: Prepare dist folder
        run: mkdir -p dist

      - name: Build CPU (always works, no GPU deps)
        run: |
          cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.27
          cp target/x86_64-unknown-linux-gnu/release/csd-gpu-miner dist/csd-pool-miner-linux-cpu
          # IMPORTANT (HiveOS bundling fix): the NVIDIA and AMD builds below
          # OVERWRITE target/x86_64-unknown-linux-gnu/release/csd-gpu-miner in
          # place (same output path, built sequentially). If the HiveOS "Package"
          # step later copies that path it gets the LAST build (= the AMD/opencl
          # binary) and ships it to EVERY rig — so an NVIDIA rig boots an opencl
          # binary ("cuda=false opencl=true" under --backend cuda). Preserve the
          # CPU build to a stable, never-overwritten path NOW and bundle THAT as
          # the HiveOS seed: CPU runs on ANY card (no GPU/driver dep), so it is the
          # brick-safe universal seed. h-run.sh's variant-aware startup check then
          # fetches+verifies+swaps the correct GPU variant for the flightsheet
          # --backend on first boot. A fetch failure leaves the rig on this working
          # CPU seed (still mining) — never bricked.
          cp target/x86_64-unknown-linux-gnu/release/csd-gpu-miner csd-gpu-miner-hiveos-seed

      # NVIDIA: the CUDA backend embeds a pre-built PTX and JITs it via the driver,
      # so this build needs NO CUDA Toolkit on the runner (cudarc dlopens the driver
      # at runtime; the PTX is committed). continue-on-error keeps CPU shipping.
      - name: Build NVIDIA (cuda + nvml telemetry)
        continue-on-error: true
        run: |
          cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.27 --features cuda,nvml
          cp target/x86_64-unknown-linux-gnu/release/csd-gpu-miner dist/csd-pool-miner-linux-nvidia

      - name: Install OpenCL loader + headers (for the AMD build)
        continue-on-error: true
        run: sudo apt-get update && sudo apt-get install -y ocl-icd-opencl-dev

      # AMD/OpenCL under zigbuild: opencl3 -> cl3 -> opencl-sys emits
      # `rustc-link-lib=OpenCL`, i.e. libOpenCL is linked at BUILD time (unlike
      # cudarc/nvml, which dlopen at runtime). zig's linker does not search the
      # host's /usr/lib/x86_64-linux-gnu (deliberately — that dir also holds the
      # runner's glibc-2.39 linker scripts, exactly what we must NOT link), so
      # stage ONLY the ICD loader stub (libOpenCL.so*) into a clean dir and -L
      # that. The stub is just the dispatch loader — the binary records a
      # DT_NEEDED on libOpenCL.so.1 and resolves the rig's OWN loader/driver at
      # runtime, so linking the runner's stub is exactly what the old
      # non-zigbuild step did, minus the glibc contamination.
      # RUSTFLAGS NOTE: the env var REPLACES .cargo/config.toml [build]
      # rustflags (cargo precedence — they do not merge), so the three
      # remap-path-prefix scrub flags from that file are repeated here to keep
      # the AMD build's panic-metadata scrub identical to the other variants'
      # (no-ops on the runner's /home/runner paths, load-bearing for local
      # builds; the same prefixes are already committed in .cargo/config.toml).
      # --allow-shlib-undefined NOTE: the runner's libOpenCL.so stub is itself
      # built against the RUNNER's glibc (references e.g. dlclose@GLIBC_2.34),
      # and zig's lld links with --no-allow-shlib-undefined by default, so
      # targeting 2.27 while linking a 2.39-vintage stub hard-errors on the
      # STUB's own internal references. Those are the stub's runtime deps —
      # on a rig, the rig's own libOpenCL.so.1 resolves against the rig's own
      # glibc (self-consistent pairing), never against ours. The flag only
      # relaxes undefined-symbol checking for symbols inside shared libs; OUR
      # binary's own undefined symbols still fail the link, and the glibc
      # floor gate below still proves OUR binary's max GLIBC need <= 2.27.
      - name: Build AMD (opencl)
        continue-on-error: true
        run: |
          mkdir -p ocl-stub
          cp -a /usr/lib/x86_64-linux-gnu/libOpenCL.so* ocl-stub/
          RUSTFLAGS="--remap-path-prefix=C:\Users\bahs_admin=/build --remap-path-prefix=/c/Users/bahs_admin=/build --remap-path-prefix=/mnt/c/Users/bahs_admin=/build -L native=$PWD/ocl-stub -C link-arg=-Wl,--allow-shlib-undefined" \
            cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.27 --features opencl
          cp target/x86_64-unknown-linux-gnu/release/csd-gpu-miner dist/csd-pool-miner-linux-amd

      # GLIBC FLOOR GATE (v0.2.1, permanent): fail-closed proof that every linux
      # miner binary built above runs on stock HiveOS (glibc >= 2.27). objdump -T
      # lists every versioned glibc symbol the binary needs; the max of those is
      # the OLDEST glibc the binary can run on. If ANY binary needs > 2.27 the
      # release is BLOCKED — this is what prevents a repeat of v0.2.0, where
      # runner-glibc-2.39 binaries shipped and crash-looped the whole HiveOS
      # fleet ("version 'GLIBC_2.39' not found"). The gate is independent of HOW
      # the binaries are built, so a future runner migration or a zigbuild
      # regression cannot silently ship an incompatible binary again.
      # DELIBERATELY EXEMPT: dist/csd-relay-node — it is a prebuilt pinned asset
      # fetched below (not built here) and its glibc floor is a known separate
      # pre-existing issue; gating it here would only block miner hotfixes.
      - name: glibc floor gate (fail-closed, all linux miner binaries)
        run: |
          set -euo pipefail
          FLOOR="2.27"
          shopt -s nullglob
          files=(dist/csd-pool-miner-linux-*)
          # The HiveOS seed is byte-identical to the CPU binary, but gate it
          # explicitly too — it is the binary every fresh HiveOS install boots.
          if [ -f csd-gpu-miner-hiveos-seed ]; then
            files+=(csd-gpu-miner-hiveos-seed)
          fi
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::glibc floor gate: no dist/csd-pool-miner-linux-* binaries found — refusing to pass an empty gate (fail-closed)."
            exit 1
          fi
          fail=0
          for f in "${files[@]}"; do
            max="$(objdump -T "$f" | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -1)"
            if [ -z "$max" ]; then
              echo "::error::glibc floor gate: could not extract any GLIBC_* version need from $f — failing closed."
              fail=1
              continue
            fi
            highest="$(printf '%s\nGLIBC_%s\n' "$max" "$FLOOR" | sort -V | tail -1)"
            if [ "$highest" != "GLIBC_$FLOOR" ]; then
              echo "::error::glibc floor gate: $f requires $max (> GLIBC_$FLOOR) — would crash-loop on stock HiveOS (glibc 2.27/2.31). Build it with cargo zigbuild --target x86_64-unknown-linux-gnu.2.27."
              fail=1
            else
              echo "glibc floor gate OK: $f (max GLIBC need: $max <= $FLOOR)"
            fi
          done
          exit "$fail"

      # SP2: Fetch the pre-built csd-relay-node Linux binary from the pinned csd2
      # release. This binary is NOT built here — it is the csd-node produced by the
      # separate CSD2 node repo.  The relay-node ends up in:
      #   - dist/csd-relay-node          (standalone download, SHA256SUMS covered)
      #   - hiveos-pkg/csdpool/          (inside the HiveOS tarball — MUST match the
      #                                   Package step's STAGE=hiveos-pkg/$PKG where
      #                                   PKG=csdpool, else the relay is staged to a
      #                                   dir the tar never picks up)
      #
      # OPERATOR: update RELAY_NODE_VERSION + RELAY_NODE_ASSET_URL before tagging.
      # RELAY_NODE_VERSION + RELAY_NODE_SHA256 are now real (relay-v0.1.9), so this
      # step HARD-BLOCKS the release: a relay download failure or SHA256 mismatch
      # fails the job instead of shipping a miner with no bundled relay. Was
      # continue-on-error: true while the constants were FILL_ME_IN (deploy-check OPS-1).
      - name: Fetch csd-relay-node binary (SP2)
        continue-on-error: false
        env:
          # ── SP2 relay-node source constants ────────────────────────────────────
          # Update ALL THREE of these when the csd2 repo cuts its first tagged release.
          # RELAY_NODE_SHA256 must be the sha256 hex of the RELAY_NODE_ASSET file at
          # that release (run: sha256sum csd-node-linux). Without it the fetch step
          # downloads but does NOT verify; set it to hard-gate the integrity check.
          RELAY_NODE_VERSION: "relay-v0.1.9"
          RELAY_NODE_REPO: "dangraagu/CSD-Mining-pool-public"
          RELAY_NODE_ASSET: "csd-node-linux"
          RELAY_NODE_SHA256: "5f6e44fefbf46dfce1edddb50733e76249198e6ee6ced6bae19761df2fcd44dc"
          # ───────────────────────────────────────────────────────────────────────
        run: |
          set -euo pipefail
          mkdir -p dist hiveos-pkg/csdpool

          # Hard-gate: fail the build (on a real tag push) if the operator has not
          # wired in a real version.  On workflow_dispatch smoke runs the step is
          # continue-on-error so this is a warning only; once the step's
          # continue-on-error is flipped to false (after real URL + SHA are set)
          # this becomes a hard build blocker.
          if [ "$RELAY_NODE_VERSION" = "FILL_ME_IN" ]; then
            if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
              echo "::error::SP2 relay-node version is still FILL_ME_IN — cannot ship a tagged release without a real relay binary. Update RELAY_NODE_VERSION + RELAY_NODE_SHA256 in release.yml."
              exit 1
            else
              echo "::warning::SP2 relay-node URL is not yet configured (RELAY_NODE_VERSION=FILL_ME_IN)."
              echo "::warning::Skipping csd-relay-node fetch. Update the constants in release.yml before shipping v0.1.9."
              exit 0
            fi
          fi

          RELAY_URL="https://github.com/${RELAY_NODE_REPO}/releases/download/${RELAY_NODE_VERSION}/${RELAY_NODE_ASSET}"
          echo "SP2: downloading csd-relay-node from $RELAY_URL"
          curl -fL --retry 3 -o dist/csd-relay-node "$RELAY_URL"

          # SHA256 integrity check: verify the downloaded binary against the pinned
          # hash BEFORE chmod+cp so a tampered/truncated download is rejected here.
          if [ "$RELAY_NODE_SHA256" = "FILL_ME_IN" ]; then
            echo "::warning::SP2: RELAY_NODE_SHA256 is FILL_ME_IN — skipping integrity verify. Set it to the expected sha256 hex of ${RELAY_NODE_ASSET} at ${RELAY_NODE_VERSION} before shipping."
          else
            GOT="$(sha256sum dist/csd-relay-node | awk '{print $1}')"
            if [ "$GOT" != "$RELAY_NODE_SHA256" ]; then
              echo "::error::SP2: SHA256 mismatch for csd-relay-node! got=$GOT want=$RELAY_NODE_SHA256"
              rm -f dist/csd-relay-node
              exit 1
            fi
            echo "SP2: csd-relay-node SHA256 OK ($GOT)"
          fi

          chmod +x dist/csd-relay-node
          # Also stage a copy for the HiveOS tarball (picked up in the next step).
          cp dist/csd-relay-node hiveos-pkg/csdpool/csd-relay-node
          echo "SP2: csd-relay-node fetched OK ($(du -sh dist/csd-relay-node | cut -f1))"

      # Package the HiveOS custom miner: the hiveos/ glue (h-manifest.conf,
      # h-config.sh, h-run.sh, h-stats.sh) + the linux CPU binary renamed to the
      # name the manifest expects (csd-gpu-miner), + the relay-node binary (SP2).
      # The tarball's top dir is the custom-miner name HiveOS extracts under
      # /hive/miners/custom/.
      - name: Package HiveOS custom miner
        run: |
          set -euo pipefail
          # Derive the version: tag (strip the leading v) on a tag build, else the
          # Cargo.toml version on a workflow_dispatch smoke run.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          fi
          # HiveOS strips the LAST '-'-separated token of the tarball filename as a
          # "version" to derive the custom-miner name, then REQUIRES the flightsheet
          # name + install dir to equal it. 'csd-pool-miner.tar.gz' -> derived
          # 'csd-pool' (strips '-miner'); even 'csd-pool.tar.gz' -> 'csd' (strips
          # '-pool'). A hyphen-FREE name has nothing to strip, so 'csdpool' is stable.
          PKG="csdpool"
          STAGE="hiveos-pkg/$PKG"
          mkdir -p "$STAGE"
          cp hiveos/h-manifest.conf hiveos/h-config.sh hiveos/h-run.sh hiveos/h-stats.sh hiveos/h-stop.sh "$STAGE"/
          chmod +x "$STAGE"/h-config.sh "$STAGE"/h-run.sh "$STAGE"/h-stats.sh "$STAGE"/h-stop.sh
          # Bundle the live terminal dashboard so it's already on every rig. Run it
          # from the Hive Shell: /hive/miners/custom/csdpool/csd-dashboard.sh
          # (read-only viewer of the miner's own /1/summary; never touches mining).
          cp csd-dashboard.sh "$STAGE"/csd-dashboard.sh
          chmod +x "$STAGE"/csd-dashboard.sh
          # The HiveOS binary must be named csd-gpu-miner (the manifest CUSTOM_BIN).
          # Bundle the PRESERVED CPU seed (csd-gpu-miner-hiveos-seed), NOT
          # target/x86_64-unknown-linux-gnu/release/csd-gpu-miner — the latter is
          # whatever variant was built LAST (AMD/opencl), which is wrong for
          # NVIDIA/CPU rigs. The CPU seed runs on any card (no GPU/driver dep) and
          # is brick-safe; h-run.sh's startup check swaps in the correct GPU
          # variant for the flightsheet --backend. Fall back to the target-dir
          # binary only if the seed is missing (should not happen — the CPU build
          # always succeeds and runs first).
          if [ -f csd-gpu-miner-hiveos-seed ]; then
            cp csd-gpu-miner-hiveos-seed "$STAGE"/csd-gpu-miner
          else
            echo "::warning::HiveOS seed csd-gpu-miner-hiveos-seed missing — falling back to target/x86_64-unknown-linux-gnu/release/csd-gpu-miner (may be the wrong variant)."
            cp target/x86_64-unknown-linux-gnu/release/csd-gpu-miner "$STAGE"/csd-gpu-miner
          fi
          chmod +x "$STAGE"/csd-gpu-miner
          # Ship the variant marker so a fresh install KNOWS its bundled seed is the
          # CPU build (h-run.sh reads this as a fallback when the binary self-report
          # is unavailable; the binary's own `devices` output stays authoritative).
          printf 'cpu\n' > "$STAGE"/.installed-variant
          # SP2: include csd-relay-node if the fetch step above placed it here.
          # The relay-node is optional at package time (the fetch step is
          # continue-on-error); its absence means the miner tarball ships without
          # relay support (valid for pre-0.1.9 test builds).
          if [ -f "$STAGE/csd-relay-node" ]; then
            chmod +x "$STAGE"/csd-relay-node
            echo "SP2: csd-relay-node included in HiveOS tarball."
          else
            echo "::warning::SP2: csd-relay-node NOT found in $STAGE — tarball ships without relay binary."
          fi
          tar -czf "dist/${PKG}-${VER}.tar.gz" -C hiveos-pkg "$PKG"
          echo "packed dist/${PKG}-${VER}.tar.gz"
          # Also publish a STABLE-NAMED copy so the HiveOS Installation URL can be
          # the non-staling  releases/latest/download/csdpool.tar.gz  form
          # (docs/HIVEOS.md) instead of a pinned vX.Y.Z tarball that goes stale
          # every release. Byte-identical to the versioned tarball; SHA256SUMS
          # (generated in the release job over every dist/ file) covers both.
          cp "dist/${PKG}-${VER}.tar.gz" "dist/${PKG}.tar.gz"
          echo "packed dist/${PKG}.tar.gz (stable-named alias for releases/latest)"
          # FIX #8: publish a tiny version-pointer asset. The launchers resolve
          # "latest" by GETting this over the releases/latest/download/ CDN, which
          # is NOT subject to the unauthenticated api.github.com 60-req/hr/IP limit
          # (the limit that silently froze whole farms behind one public IP). Bare
          # version, no leading 'v', single line. SHA256SUMS (generated in the
          # release job over every dist/ file) covers it too, so a tampered
          # version-pointer is detectable — but it only selects WHICH version to
          # fetch; the binary itself is still SHA-verified before any swap.
          printf '%s\n' "$VER" > dist/latest-version.txt
          echo "wrote dist/latest-version.txt ($VER)"

      # Publish the self-updating launchers as release assets. Existing rigs refresh
      # them via mine-auto.sh:update_launcher_self, which downloads
      # releases/latest/download/mine-auto.{sh,bat} and SHA-verifies it against the
      # release SHA256SUMS (FAIL-CLOSED if the asset or its checksum is absent).
      # Staging them here — in the SAME linux job whose dist/ the single release job
      # flattens and checksums — is what makes SHA256SUMS cover them WITHOUT a second
      # publisher racing the digests file. Without this step the launcher
      # self-update is a permanent no-op (the asset 404s / has no checksum entry).
      - name: Stage self-updating launchers + dashboards (mine-auto + csd-dashboard)
        run: |
          set -euo pipefail
          # The dashboards self-update exactly like the launchers: csd-dashboard
          # --update downloads releases/latest/download/csd-dashboard.{sh,bat} and
          # SHA-verifies it against THIS release's SHA256SUMS (fail-closed if the
          # asset or its checksum entry is absent). Staging them in the SAME linux
          # job whose dist/ the single release job flattens + checksums is what makes
          # SHA256SUMS cover them without a second publisher racing the digests file.
          cp mine-auto.sh mine-auto.bat csd-dashboard.sh csd-dashboard.bat dist/
          echo "staged launchers + dashboards:"; ls -1 dist/mine-auto.sh dist/mine-auto.bat dist/csd-dashboard.sh dist/csd-dashboard.bat

      - name: List built artifacts
        run: ls -la dist

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/*
          if-no-files-found: error

  # Single publisher: gather every built asset, emit ONE SHA256SUMS over all of
  # them, then publish binaries + HiveOS tarball + SHA256SUMS together. Runs only
  # on a tag (the build jobs still run on workflow_dispatch as a compile smoke
  # test, but nothing is published there).
  release:
    needs: [test, windows, linux]   # publish only after the shell suite + both build jobs pass
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect assets + generate SHA256SUMS
        run: |
          set -euo pipefail
          mkdir -p dist
          # Flatten dist-windows/ and dist-linux/ into one dist/.
          find artifacts -type f -exec cp -t dist/ {} +
          cd dist
          # One checksums file over every published asset (sha256sum format:
          # "<hex>  <filename>"), which verify-file / sha256sum -c read back.
          # Build an explicit file list that EXCLUDES SHA256SUMS itself so the
          # digests file can never (self-)reference a partially-written copy of
          # itself regardless of glob/redirect ordering.
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\n' | sort > .asset-list
          xargs -a .asset-list sha256sum -- > SHA256SUMS
          rm -f .asset-list
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: false
